{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spanforge.fullname" . }}-secrets
  labels:
    {{- include "spanforge.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if .Values.secret.sfApiKey }}
  SF_API_KEY: {{ .Values.secret.sfApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.sfOrgSecret }}
  SF_ORG_SECRET: {{ .Values.secret.sfOrgSecret | b64enc | quote }}
  {{- end }}
  {{- range $key, $val := .Values.secret.extra }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
